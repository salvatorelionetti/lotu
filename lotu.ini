# Fritz.box parameters
[fritzbox]
FB_IP = 192.168.178.1
USER = <fritzbox user>
# Intervallo di controllo in secondi
POLL_INTERVAL = 3
# Debug
OUTPUT_XML = /tmp/fritz_box_events.xml'
                    
# Talk2 parameters  
[talk]
NC_URL = <https://url_of_nextcloud_instance>
ROOM_TOKEN = <room_token>
# Bot
#SECRET = ...
# User bot
BOT_USER = <nextcloud_user_used_as_bot<
BOT_SECRET = <bot_secret>
PASSWORD = <password>
